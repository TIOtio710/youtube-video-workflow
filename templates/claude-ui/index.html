<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #faf9f5;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="15"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="claude"
        data-composition-id="claude"
        data-composition-src="compositions/claude.html"
        data-start="0"
        data-duration="15"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 1"
      ></div>

      <!-- SFX: puncak klik ±1 frame setelah klik di layar (click.mp3 peak 0,073 dtk). -->
      <audio id="sfx-click-input" class="clip" src="assets/sfx/click.mp3" data-start="1.08" data-duration="0.36" data-track-index="2" data-volume="1.4"></audio>
      <audio id="sfx-type-1" class="clip" src="assets/sfx/typing.mp3" data-start="1.5" data-media-start="0.44" data-duration="1.05" data-track-index="3" data-volume="1.6"></audio>
      <audio id="sfx-type-2" class="clip" src="assets/sfx/typing.mp3" data-start="2.55" data-media-start="0.5" data-duration="1.0" data-track-index="3" data-volume="1.5"></audio>
      <audio id="sfx-type-3" class="clip" src="assets/sfx/typing.mp3" data-start="3.55" data-media-start="0.44" data-duration="0.85" data-track-index="3" data-volume="1.6" data-fade-out="0.12"></audio>
      <audio id="sfx-click-send" class="clip" src="assets/sfx/click.mp3" data-start="5.01" data-duration="0.36" data-track-index="2" data-volume="1.4"></audio>
      <audio id="sfx-whoosh" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="5.19" data-duration="0.57" data-track-index="4" data-volume="0.35"></audio>
      <audio id="sfx-click-copy" class="clip" src="assets/sfx/click-soft.mp3" data-start="13.36" data-duration="0.36" data-track-index="2" data-volume="1.4"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
