          <path d="M11 4.5a1.8 1.8 0 0 1 3.6 0V13l.2-2.4a1.8 1.8 0 0 1 3.5.2l.1 2.4.3-1.6a1.7 1.7 0 0 1 3.3.4v1.2l.2-.6a1.6 1.6 0 0 1 3.1.6v5.6c0 4.6-3 7.7-7.4 7.7h-1.6c-2.4 0-4-1-5.4-3L6.2 18a1.8 1.8 0 0 1 2.8-2.3l2 2.2z" fill="#fff" stroke="#111" stroke-width="1.5" stroke-linejoin="round" />
        </svg>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const root = document.querySelector('[data-composition-id="claude"]');
      const $ = (s) => root.querySelector(s);

      // Pecah jawaban jadi kata, supaya bisa muncul bertahap seperti streaming.
      const words = [];
      root.querySelectorAll("#resp p").forEach((p) => {
        const parts = p.textContent.split(/(\s+)/);
        p.textContent = "";
        parts.forEach((t) => {
          if (/^\s+$/.test(t)) {
            p.appendChild(document.createTextNode(t));
          } else if (t) {
            const s = document.createElement("span");
            s.className = "w";
            s.textContent = t;
            p.appendChild(s);
            words.push(s);
          }
        });
      });

      const prompt = $("#ububble").textContent.trim();
      const typed = $("#typed");
      const cam = $("#cam");
      const cursor = $("#cursor");
      const ripple = $("#ripple");

      // Zoom kamera ke titik (cx, cy) UI dengan skala s, titik itu jadi tengah frame.
      const camTo = (cx, cy, s) => ({
        x: s === 1 ? 0 : 960 - cx * s,
        y: s === 1 ? 0 : 540 - cy * s,
        scale: s,
      });
      // Ujung kursor ada di (5,3) dalam SVG 30x30.
      const cur = (x, y) => ({ x: x - 5, y: y - 3 });
      const click = (tl, x, y, at) => {
        tl.fromTo(ripple, { x, y, scale: 0.3, opacity: 0.9 }, { scale: 1.25, opacity: 0, duration: 0.45, ease: "power2.out", immediateRender: false }, at);
        tl.fromTo(cursor, { scale: 1 }, { scale: 0.86, duration: 0.07, ease: "power1.in", yoyo: true, repeat: 1, transformOrigin: "5px 3px", immediateRender: false }, at);
      };

      const tl = gsap.timeline({ paused: true });

      tl.set(cam, { transformOrigin: "0 0", x: 0, y: 0, scale: 1 }, 0);
      tl.set(typed, { textContent: "" }, 0);
      tl.set(cursor, cur(1290, 760), 0);
      tl.set(ripple, { opacity: 0 }, 0);
      tl.set("#rec-old", { y: -34 }, 0);

      // 0.3–1.1: kursor ke kotak input, klik.
      tl.to(cursor, { ...cur(860, 430), duration: 0.8, ease: "power2.inOut" }, 0.3);
      click(tl, 860, 430, 1.12);
      tl.set("#caret", { opacity: 1 }, 1.14);
      tl.to(cam, { ...camTo(1110, 456, 1.45), duration: 0.75, ease: "power3.inOut" }, 1.05);

      // 1.5–4.4: mengetik.
      const typer = { n: 0 };
      tl.fromTo(
        typer,
        { n: 0 },
        {
          n: prompt.length,
          duration: 2.9,
          ease: "none",
          onUpdate: () => {
            typed.textContent = prompt.slice(0, Math.round(typer.n));
          },
        },
        1.5,
      );
      tl.to("#in-ph", { opacity: 0, duration: 0.01 }, 1.52);
      tl.to("#send-on", { opacity: 1, duration: 0.12 }, 1.52);
      // caret kedip saat jeda sebelum klik kirim
      tl.to("#caret", { opacity: 0, duration: 0.01 }, 4.65);
      tl.to("#caret", { opacity: 1, duration: 0.01 }, 4.95);

      // 4.45–5.05: kursor ke tombol kirim, jadi tangan, klik.
      tl.to(cursor, { ...cur(1476, 490), duration: 0.55, ease: "power2.inOut" }, 4.45);
      tl.to("#cur-arrow", { opacity: 0, duration: 0.01 }, 4.95);
      tl.to("#cur-hand", { opacity: 1, duration: 0.01 }, 4.95);
      click(tl, 1476, 490, 5.05);
      tl.fromTo("#send", { scale: 1 }, { scale: 0.9, duration: 0.07, yoyo: true, repeat: 1 }, 5.05);

      // 5.2–5.8: zoom out, pindah ke layar chat.
      tl.to(cam, { ...camTo(0, 0, 1), duration: 0.7, ease: "power3.inOut" }, 5.2);
      tl.to("#home", { opacity: 0, duration: 0.25, ease: "power1.out" }, 5.2);
      tl.to("#chat", { opacity: 1, duration: 0.2 }, 5.35);
      tl.fromTo("#ububble", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 5.35);
      tl.to("#rec-old", { y: 0, duration: 0.3, ease: "power2.out" }, 5.45);
      tl.to("#rec-new", { opacity: 1, duration: 0.3 }, 5.6);
      tl.to("#cur-hand", { opacity: 0, duration: 0.01 }, 5.4);
      tl.to("#cur-arrow", { opacity: 1, duration: 0.01 }, 5.4);
      tl.to(cursor, { ...cur(1420, 640), duration: 0.9, ease: "power2.inOut" }, 5.5);

      // 5.6–6.5: Claude "berpikir" (spark berputar).
      tl.fromTo("#think", { opacity: 0, rotation: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)" }, 5.6);
      tl.to("#think", { rotation: 180, duration: 0.9, ease: "power1.inOut" }, 5.6);
      tl.to("#think", { opacity: 0, scale: 0.6, duration: 0.15 }, 6.5);

      // 6.55–11.6: jawaban streaming.
      tl.to(words, { opacity: 1, duration: 0.08, stagger: 5.0 / words.length, ease: "none" }, 6.55);
      tl.fromTo("#stream-spark", { opacity: 0 }, { opacity: 1, duration: 0.15 }, 6.55);
      tl.to("#stream-spark", { rotation: 360, duration: 5.0, ease: "none" }, 6.55);
      tl.to("#stream-spark", { opacity: 0, duration: 0.15 }, 11.6);
      tl.to("#actions", { opacity: 1, duration: 0.25 }, 11.7);

      // 11.9–12.6: zoom ke versi 2, lalu kursor ke tombol copy.
      tl.to(cam, { ...camTo(1110, 470, 1.32), duration: 0.8, ease: "power3.inOut" }, 11.85);
      tl.to(cursor, { ...cur(721, 617), duration: 0.75, ease: "power2.inOut" }, 12.55);
      tl.to("#act-copy-bg", { opacity: 1, duration: 0.12 }, 13.1);
      tl.to("#cur-arrow", { opacity: 0, duration: 0.01 }, 13.1);
      tl.to("#cur-hand", { opacity: 1, duration: 0.01 }, 13.1);
      click(tl, 721, 617, 13.4);
      tl.fromTo("#tip", { opacity: 0, y: -6 }, { opacity: 1, y: 0, duration: 0.2, ease: "power2.out" }, 13.45);

      window.__timelines = window.__timelines || {};
      window.__timelines["claude"] = tl;
    })();
  </script>
</template>
